<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portafolio de Cesar Miño, desarrollador de software backend y estudiante de octavo semestre de Ingeniería de Software.">
  <meta name="color-scheme" content="dark light">
  <title>Cesar Miño · Desarrollador de Software</title>

  <!-- Tipografías: Inter (cuerpo) + JetBrains Mono (etiquetas, código) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Estilos: primero los tokens, luego el resto -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/styles.css">

  <!-- Aplica el tema guardado antes del primer pintado para evitar un parpadeo.
       La lógica completa del tema vive en js/theme.js. -->
  <script>
    try {
      if (localStorage.getItem('portafolio-theme') === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    } catch (e) { /* localStorage no disponible */ }
  </script>
</head>
<body>

  <!-- ===================== CABECERA / NAVEGACIÓN ===================== -->
  <header class="site-header">
    <div class="site-header__inner">
      <a class="logo" href="#inicio" aria-label="Ir al inicio">
        <span class="logo__dot" aria-hidden="true"></span>cesar<span class="logo__slash">/</span>dev
      </a>

      <nav class="nav" id="nav-principal" aria-label="Navegación principal">
        <ul class="nav__list">
          <li><a class="nav__link" href="#sobre-mi">Sobre mí</a></li>
          <li><a class="nav__link" href="#habilidades">Habilidades</a></li>
          <li><a class="nav__link" href="#proyectos">Proyectos</a></li>
          <li><a class="nav__link" href="#design-system">Design System</a></li>
          <li><a class="nav__link" href="#contacto">Contacto</a></li>
        </ul>
      </nav>

      <div class="site-header__actions">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Cambiar tema" title="Cambiar tema">
          <span class="theme-toggle__label" id="theme-label">dark</span>
          <span class="theme-toggle__track" aria-hidden="true"><span class="theme-toggle__knob"></span></span>
        </button>
        <button class="menu-btn" id="menu-btn" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="nav-principal">
          <span class="menu-btn__bar" aria-hidden="true"></span>
          <span class="menu-btn__bar" aria-hidden="true"></span>
          <span class="menu-btn__bar" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </header>

  <!-- ===================== CONTENIDO PRINCIPAL ===================== -->
  <main>
<!-- @sections -->
  </main>

  <!-- ===================== PIE DE PÁGINA ===================== -->
  <footer class="site-footer">
    <div class="site-footer__inner">
      <p class="site-footer__text">© 2026 Cesar Miño</p>
      <p class="site-footer__text">Inter + JetBrains Mono · tokens en :root</p>
    </div>
  </footer>

  <!-- ===================== VOLVER ARRIBA ===================== -->
  <button class="to-top" id="to-top" type="button" aria-label="Volver arriba" hidden>↑</button>

  <!-- ===================== MODAL DE PROYECTO ===================== -->
  <div class="modal" id="project-modal" hidden>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
      <figure class="modal__media" id="modal-media">
        <span class="placeholder-label" id="modal-image-label">captura 16:8</span>
        <figcaption class="sr-only" id="modal-figcaption">Imagen del proyecto</figcaption>
      </figure>
      <button class="modal__close" id="modal-close" type="button" aria-label="Cerrar">×</button>
      <div class="modal__body">
        <p class="modal__meta" id="modal-meta"></p>
        <h2 class="modal__title" id="modal-title"></h2>
        <p class="modal__summary" id="modal-summary"></p>
        <p class="modal__detail" id="modal-detail"></p>
        <ul class="tags" id="modal-tags" aria-label="Tecnologías"></ul>
        <div class="modal__footer">
          <a class="btn btn--primary" id="modal-repo" href="#" target="_blank" rel="noreferrer"><span class="mono" aria-hidden="true">&lt;/&gt;</span> Repositorio</a>
          <a class="btn btn--secondary" id="modal-demo" href="#" target="_blank" rel="noreferrer"><span class="mono" aria-hidden="true">↗</span> Demo en vivo</a>
        </div>
      </div>
    </div>
  </div>

  <!-- ===================== SCRIPTS (defer, en orden, sin módulos) ===================== -->
  <script src="js/data.js" defer></script>
  <script src="js/theme.js" defer></script>
  <script src="js/nav.js" defer></script>
  <script src="js/projects.js" defer></script>
  <script src="js/contact.js" defer></script>
  <script src="js/editor.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
